<div><label>Harga/kg</label><input id="hargaKg" type="number" value="5000"></div>
</div>
<input id="totalBayar" readonly style="font-weight:bold;font-size:20px;background:#e8f5e9">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
<button class="btn-green" onclick="selesaikan()">🖨️ Selesaikan & Print</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, getDocs, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
const firebaseConfig = { apiKey:"AIzaSyAdbmL6JtCACcm1Xn50fEYNJY6coPUilnU", authDomain:"rongsokku-b1883.firebaseapp.com", projectId:"rongsokku-b1883", storageBucket:"rongsokku-b1883.firebasestorage.app", messagingSenderId:"541378550341", appId:"1:541378550341:web:b599bbb1f93131aa54212c" };
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const log=m=>{document.getElementById('log').innerText+=m+"\n"; console.log(m);};
const statusEl=document.getElementById('status');

try{
 await signInAnonymously(auth);
 log("✅ Auth OK: "+auth.currentUser.uid);
 statusEl.innerText="✅ Terhubung, ambil data...";
}catch(e){ log("❌ Auth gagal: "+e.message); statusEl.innerText="❌ Auth gagal: "+e.message; }

let cache={}; let selectedId=null, selectedData=null;

async function loadData(){
 try{
  const snap=await getDocs(collection(db,"Barang"));
  log(`📦 Total Barang di DB: ${snap.size}`);
  if(snap.empty){ document.getElementById('list').innerHTML="<p style='text-align:center;color:#999'>Belum ada barang masuk<br>Suruh penjual upload dulu</p>"; statusEl.innerText="Menunggu barang masuk..."; return; }
  let html=""; let masuk=0;
  snap.forEach(d=>{
   const x=d.data(); cache[d.id]=x;
   if(x.Status==="Masuk" || !x.Status){ masuk++; html+=`<div class="item" onclick="pilih('${d.id}')"><img src="${x.Foto_URL}" style="width:60px;height:60px;object-fit:cover;border-radius:8px"><div><b>${x.Nama_Penjual||'Warga'}</b><br>${x.Jenis} - ${x.Berat_Perkiraan}kg<br><small>${x.Alamat_Jemput||''}</small></div></div>`; }
  });
  log(`✅ Barang Masuk: ${masuk}`);
  statusEl.innerText=`Ada ${masuk} barang menunggu`;
  document.getElementById('list').innerHTML=html||"<p>Tidak ada yang status Masuk</p>";
 }catch(e){ log("❌ Error ambil Barang: "+e.message); statusEl.innerText="❌ Error: "+e.message+"\nCek Rules Firestore Publish"; alert("Error: "+e.message); }
}
loadData();

window.pilih=(id)=>{
 selectedId=id; selectedData=cache[id];
 document.getElementById('actionCard').style.display='block';
 document.getElementById('detailJudul').innerText=selectedData.Jenis+" - "+selectedData.Nama_Penjual;
 document.getElementById('detailAlamat').innerText=selectedData.Alamat_Jemput;
 document.getElementById('detailFoto').src=selectedData.Foto_URL;
 document.getElementById('beratFinal').value=selectedData.Berat_Perkiraan;
 document.getElementById('hargaKg').value=5000;
 hitung();
 document.getElementById('actionCard').scrollIntoView({behavior:'smooth'});
}
function hitung(){ const b=Number(document.getElementById('beratFinal').value||0); const h=Number(document.getElementById('hargaKg').value||0); document.getElementById('totalBayar').value="Rp "+(b*h).toLocaleString('id-ID'); }
document.getElementById('beratFinal').addEventListener('input',hitung);
document.getElementById('hargaKg').addEventListener('input',hitung);

window.selesaikan=async()=>{
 const berat=Number(document.getElementById('beratFinal').value);
 const hargaKg=Number(document.getElementById('hargaKg').value);
 const total=berat*hargaKg;
 document.getElementById('selesaiStatus').innerText="⏳ Menyimpan...";
 await updateDoc(doc(db,"Barang",selectedId),{Berat_Final:berat,Harga_Per_Kg:hargaKg,Harga_Final:total,Status:"Selesai",updatedAt:serverTimestamp()});
 document.getElementById('isiStruk').innerHTML=`Penjual: ${selectedData.Nama_Penjual}<br>Jenis: ${selectedData.Jenis}<br>Berat: ${berat}kg<br>Harga: Rp ${hargaKg}/kg<br><b>Total: Rp ${total.toLocaleString('id-ID')}</b>`;
 document.getElementById('tglStruk').innerText=new Date().toLocaleString('id-ID');
