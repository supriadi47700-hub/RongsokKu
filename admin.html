<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, query, where, getDocs, doc, updateDoc, serverTimestamp, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAdbmL6JtCACcm1Xn50fEYNJY6coPUilnU",
  authDomain: "rongsokku-b1883.firebaseapp.com",
  projectId: "rongsokku-b1883",
  storageBucket: "rongsokku-b1883.firebasestorage.app",
  messagingSenderId: "541378550341",
  appId: "1:541378550341:web:b599bbb1f93131aa54212c"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
await signInAnonymously(auth);

let selectedId=null;
let selectedData=null;

const qMasuk = query(collection(db,"Barang"), where("Status","==","Masuk"));
onSnapshot(qMasuk, snap=>{
  if(snap.empty){ document.getElementById('list').innerHTML='<p style="color:#999;text-align:center;padding:20px">Belum ada barang masuk hari ini<br>💤</p>'; return; }
  document.getElementById('list').innerHTML = snap.docs.map(d=>{
    const x=d.data();
    const tgl = x.createdAt?.toDate ? x.createdAt.toDate().toLocaleTimeString('id-ID') : '';
    return `<div class="item" onclick="pilih('${d.id}')">
      <img src="${x.Foto_URL}" style="width:70px;height:70px;object-fit:cover;border-radius:8px">
      <div><b>${x.Nama_Penjual||'Warga'}</b><br>${x.Jenis} - ${x.Berat_Perkiraan}kg<br><small>📍 ${x.Alamat_Jemput?.substring(0,20)||''} • ${tgl}</small></div>
    </div>`;
  }).join('');
  window._cache={}; snap.docs.forEach(d=>window._cache[d.id]=d.data());
});

window.pilih = (id)=>{
  selectedId=id; selectedData=window._cache[id];
  document.getElementById('actionCard').style.display='block';
  document.getElementById('detailJudul').innerText=selectedData.Jenis+' - '+selectedData.Nama_Penjual;
  document.getElementById('detailAlamat').innerText='📍 '+selectedData.Alamat_Jemput;
  document.getElementById('detailFoto').src=selectedData.Foto_URL;
  document.getElementById('beratFinal').value=selectedData.Berat_Perkiraan;
  document.getElementById('hargaKg').value=5000;
  hitung();
  document.getElementById('actionCard').scrollIntoView({behavior:'smooth'});
}

function hitung(){
  const b=Number(document.getElementById('beratFinal').value||0);
  const h=Number(document.getElementById('hargaKg').value||0);
  document.getElementById('totalBayar').value='Rp '+(b*h).toLocaleString('id-ID');
}
document.getElementById('beratFinal').addEventListener('input', hitung);
document.getElementById('hargaKg').addEventListener('input', hitung);

window.selesaikan = async (ukuran)=>{
  const berat=Number(document.getElementById('beratFinal').value);
  const hargaKg=Number(document.getElementById('hargaKg').value);
  const total=berat*hargaKg;
  const st=document.getElementById('selesaiStatus');
  st.innerText='⏳ Menyimpan...';
  await updateDoc(doc(db,"Barang",selectedId),{
    Berat_Final: berat,
    Harga_Per_Kg: hargaKg,
    Harga_Final: total,
    Status: "Selesai",
    updatedAt: serverTimestamp()
  });
  document.getElementById('isiStruk').innerHTML=`
    Penjual: ${selectedData.Nama_Penjual}<br>
    Jenis: ${selectedData.Jenis}<br>
    Berat: ${berat} kg<br>
    Harga: Rp ${hargaKg}/kg<br>
    <b>Total: Rp ${total.toLocaleString('id-ID')}</b><br>
    Alamat: ${selectedData.Alamat_Jemput}
  `;
  document.getElementById('tglStruk').innerText=new Date().toLocaleString('id-ID');
  document.getElementById('strukArea').style.display='flex';
  const w = ukuran==='58mm'? 220 : 300;
  document.getElementById('struk').style.width=w+'px';
  st.innerText='✅ Selesai! Struk siap.';
  setTimeout(()=>window.print(), 300);
}

window.shareWA = async ()=>{
  const el=document.getElementById('struk');
  document.getElementById('strukArea').style.display='flex';
  const canvas=await html2canvas(el);
  canvas.toBlob(async blob=>{
    const file=new File([blob], "struk-rongsokku.png", {type:"image/png"});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:"Struk RongsokKu", text:`Pembayaran ${selectedData.Nama_Penjual} - Rp ${document.getElementById('totalBayar').value}`});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='struk-'+selectedData.Nama_Penjual+'.png'; a.click();
      alert('Gambar struk didownload, silakan share manual ke WA');
    }
  });
}
</script>
